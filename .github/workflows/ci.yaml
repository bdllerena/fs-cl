name: CI

# Runs on every pull request against any branch, and on pushes to main so the
# post-merge state is verified too. Pull requests run the four CI stages only;
# the image and deploy stages are gated on main (see their `if:` conditions), so
# a pull request can never push an image or touch the cluster.
# Defect fixed (findings P1-11): the previous `feature-*` push filter never matched
# `feature/*` branches, because `*` does not cross `/` in GitHub branch globs.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

# Defect fixed (findings P1-12): no permissions block meant the default, overly broad
# GITHUB_TOKEN scope. This workflow only reads the repository.
permissions:
  contents: read

# Defect fixed (findings P1-12): without a concurrency group, every push to a PR
# branch left the previous, now-obsolete run occupying a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Defect fixed (findings P0-2): the application is not at the repository root.
  # Single source of truth for the application directory, used by the cache paths
  # below. Cache paths are workspace-relative and are NOT affected by
  # defaults.run.working-directory.
  APP_DIR: codebase/rdicidr-0.1.0

defaults:
  run:
    # Defect fixed (findings P0-2): every npm step previously ran at the repository
    # root, where no package.json exists.
    working-directory: codebase/rdicidr-0.1.0

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Defect fixed (findings P0-33, found by run 36176886901): the cache key is
      # computed once here, from the pristine checked-out lockfile, and reused by
      # every downstream job. Previously each job called hashFiles() itself, and the
      # save step evaluated it AFTER `npm install` had rewritten package-lock.json,
      # so install saved under one key while lint/test/build restored another.
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Defect fixed (findings P0-4): the workflow hardcoded Node 14 while
          # package.json requires >=15 <16 and .npmrc sets engine-strict=true.
          # .nvmrc is now the single source of truth.
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc

      - name: Compute dependency cache key
        id: cache-key
        # Must run BEFORE `npm install`, while package-lock.json is still the
        # committed version. Defect fixed (findings P1-8): the old pattern
        # 'package-lock.json' resolved against GITHUB_WORKSPACE, matched nothing, and
        # returned an empty string, collapsing every key to the constant
        # "node-modules-" so the cache never invalidated on a dependency change.
        run: echo "key=node-modules-${{ runner.os }}-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Cache node_modules
        uses: actions/cache/save@v6
        with:
          path: ${{ env.APP_DIR }}/node_modules
          key: ${{ steps.cache-key.outputs.key }}

  lint:
    name: Lint (ESLint)
    # Defect fixed: lint, test and build previously all depended only on `install`
    # and ran in parallel. The required order is install -> lint -> test -> build.
    # `install` stays in `needs` throughout so its cache-key output stays reachable.
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.APP_DIR }}/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          # Defect fixed (findings P1-9): a cache miss used to pass silently and the
          # job then died several steps later with a misleading
          # "command not found". Now it fails at the restore step.
          fail-on-cache-miss: true

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test (Jest)
    needs: [install, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.APP_DIR }}/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run Jest
        run: CI=true npm run test

  build:
    name: Build
    needs: [install, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.APP_DIR }}/node_modules
          # Defect fixed (findings P0-7): this job restored the key "deps-..." while
          # the install job saved "node-modules-...", so the restore always missed,
          # the build ran without node_modules, and it failed with
          # "react-scripts: command not found".
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build production bundle
        run: npm run build

  # ---------------------------------------------------------------------------
  # Continuous delivery. Both jobs are gated on a push to main, so they never run
  # for a pull request.
  # ---------------------------------------------------------------------------

  image:
    name: Build and push image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Native arm64 runner: the EKS node group is t4g.medium (Graviton). Building
    # on an amd64 runner would produce an image the nodes cannot execute, and
    # cross-building under QEMU is several times slower. Free for public repos.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      # Required to request the OIDC token that is exchanged for the AWS role.
      # No long-lived AWS access keys exist anywhere in this workflow.
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    defaults:
      run:
        # Overrides the workflow-level default: these steps work from the
        # repository root, not the application directory.
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::931686776282:role/github-actions-eks
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image reference
        id: meta
        run: |
          echo "image=${{ steps.ecr.outputs.registry }}/rdicidr:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Skip build if this commit is already in ECR
        id: exists
        run: |
          # The repository is tag-immutable, so re-running this workflow for a
          # commit that was already pushed would otherwise fail on PutImage.
          if aws ecr describe-images --repository-name rdicidr \
               --image-ids "imageTag=${GITHUB_SHA}" --region us-east-1 >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Image for ${GITHUB_SHA} already present; skipping build."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.exists.outputs.found == 'false'
        run: |
          docker build -t "${{ steps.meta.outputs.image }}" codebase/rdicidr-0.1.0
          docker push "${{ steps.meta.outputs.image }}"

  deploy:
    name: Deploy to EKS
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # One deploy at a time; never cancel a half-applied rollout.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.alb.outputs.url }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::931686776282:role/github-actions-eks
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name demo-eks --region us-east-1

      - name: Pin the image to this commit
        run: |
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${GITHUB_SHA}|" k8s/overlays/aws/kustomization.yaml
          kubectl kustomize k8s/overlays/aws | grep -E "^\s+image:"

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/aws

      - name: Wait for rollout
        run: kubectl rollout status statefulset/rdicidr -n production --timeout=5m

      - name: Resolve the load balancer address
        id: alb
        run: |
          # The controller provisions the ALB asynchronously; the Ingress gets its
          # hostname once the load balancer is active.
          for i in $(seq 1 60); do
            host=$(kubectl get ingress rdicidr -n production \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [ -n "$host" ] && break
            sleep 10
          done
          if [ -z "$host" ]; then
            echo "::error::Ingress did not receive a load balancer hostname in 10 minutes"
            kubectl describe ingress rdicidr -n production
            exit 1
          fi
          echo "url=http://${host}" >> "$GITHUB_OUTPUT"
          echo "Application URL: http://${host}"

      - name: Smoke-test through the load balancer
        run: |
          url="${{ steps.alb.outputs.url }}"
          # A new ALB takes a little while to start passing traffic even after it
          # reports active, so the check is retried rather than run once.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${url}/health" || true)
            if [ "$code" = "200" ]; then
              echo "GET ${url}/health -> 200"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${url}/health never returned 200"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed to EKS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ needs.image.outputs.image }}\` |"
            echo "| Cluster | demo-eks (us-east-1) |"
            echo "| Namespace | production |"
            echo "| URL | ${{ steps.alb.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
