server {
    # Port 8080, not 80: ports below 1024 require root. Serving from an
    # unprivileged port lets the container run as a non-root user, which in turn
    # lets the Pod declare runAsNonRoot.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are routed to the React router, not 404'd.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Probe endpoint for the Kubernetes liveness and readiness probes.
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
