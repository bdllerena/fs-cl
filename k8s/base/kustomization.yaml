apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-independent objects. The Ingress lives in the overlays because the
# two targets front the app differently: nginx-ingress on Minikube, an AWS ALB on
# EKS. Order matters here -- the namespace must be created first.
resources:
  - namespace.yaml
  - statefulset.yaml
  - service.yaml

images:
  - name: rdicidr
    newTag: "0.1.0"
